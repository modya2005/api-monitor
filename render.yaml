services:
  - type: web
    name: api-monitor
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SESSION_DAYS
        value: "7"
      - key: ALLOW_PRIVATE_HOSTS
        value: "false"
      - key: ENABLE_DEMO_ENDPOINTS
        value: "false"
      - key: RETENTION_DAYS
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DEFAULT_ALERT_EMAIL
        sync: false
